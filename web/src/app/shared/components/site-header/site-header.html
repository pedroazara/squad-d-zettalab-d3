<header class="site-header">
  <div class="site-header__bar page-width">
    <a class="site-header__brand" routerLink="/">
      <span class="site-header__mark" aria-hidden="true"></span>

      <span class="site-header__copy">
        <strong>Cerrado-Forca</strong>
        <small>Plataforma de apoio ao IBAMA</small>
      </span>
    </a>

    <nav class="site-header__nav" aria-label="Navegacao principal">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="site-header__actions">
      <a class="tactical-button tactical-button--secondary" routerLink="/notificar">
        <span class="material-symbols-outlined">local_fire_department</span>
        Notificar incendio
      </a>

      @if (currentUser(); as user) {
        <div class="site-header__user">
          <span class="status-pill">{{ userRoleLabel() }}</span>
          <strong>{{ user.name }}</strong>
        </div>

        <button class="tactical-button tactical-button--ghost" type="button" (click)="logout()">
          Sair
        </button>
      } @else {
        <a class="tactical-button tactical-button--ghost" routerLink="/login">Entrar</a>
      }
    </div>
  </div>
</header>
